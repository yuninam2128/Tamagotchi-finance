<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>돈감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one dark retro look on purpose (handheld-pet toy shot on black). 3D egg device on top, poster-style 4-stat strip, LCD-green cards, pixel labels. */
:root{
  color-scheme:dark;
  --bg:#0A090D; --surface:#16131C; --surface-2:#211C2A; --ink:#F2EEF7; --ink-2:#B3A9C2; --ink-3:#7E7590; --line:#3A3247;
  --lcd:#C8D2B4; --lcd-2:#B4BF9C; --lcd-ink:#1E2316; --lcd-ink-2:#4D5640;
  --accent:#D6337F; --accent-ink:#FFFFFF; --accent-soft:#3A1528; --violet:#8E5BD8; --violet-soft:#2A1E3D; --lilac:#C98BE6;
  --sun:#F2C14E; --sun-soft:#3A2F12; --rain:#7FA6D8; --rain-soft:#1A2434;
  --ok:#7BE0A0; --ok-soft:#163223; --bad:#FF6B7A; --bad-soft:#3A1820; --gold:#F2C14E; --gold-soft:#3A2F12;
  --f-pix:"Press Start 2P","DotGothic16",ui-monospace,monospace;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Press Start 2P",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}
.pix{font-family:var(--f-pix);letter-spacing:.02em;text-transform:uppercase}
.app{max-width:460px;margin:0 auto;padding-block:10px 32px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-block:6px 0}
.logo{font-family:var(--f-pix);font-size:10px;line-height:1.7;color:var(--ink);letter-spacing:.04em}
.logo b{display:block;font-family:var(--f-body);font-size:22px;letter-spacing:-.03em;line-height:1.2}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;font-weight:700;font-size:11px;font-family:var(--f-num)}
.pill .c{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:9px;color:#fff;font-family:var(--f-pix)}
.c.p{background:var(--gold);color:#1a1405} .c.f{background:var(--accent)}
.c svg{width:13px;height:13px;fill:#fff}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}

.stage{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1/1.08;max-width:100%;background:#000;touch-action:pan-y;cursor:pointer}

.fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;padding:20px;text-align:center}
.shud{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;font-family:var(--f-pix);font-size:9px;line-height:1.8;color:#E9E3F2;letter-spacing:.04em}
.shud div:last-child{text-align:right}
.shud b{color:var(--lilac);font-weight:400}
.stagecta{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:1px solid #E9E3F2;color:#E9E3F2;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;pointer-events:none;white-space:nowrap;background:rgba(0,0,0,.6)}

.meters{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid #E9E3F2;border-radius:8px;overflow:hidden}
.meter{display:grid;gap:8px;padding:12px 8px 12px;text-align:center;border-left:1.5px solid #E9E3F2;align-content:space-between}
.meter:first-child{border-left:0}

.pbar{height:10px;border:1.5px solid #E9E3F2;border-radius:99px;padding:1.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
.label{font-size:13px;color:var(--ink-2);font-weight:600}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--f-num);font-size:22px;line-height:1.3}
.muted{color:var(--ink-2)}

.cta h2{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.35}
.btn{border:0;border-radius:8px;padding:15px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%;box-shadow:0 4px 0 #7E1846}

.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 4px 0 #0d0b11}
.btn.ok{background:#3FAF72;color:#06140C;box-shadow:0 4px 0 #1E6B43} .btn.bad{background:var(--bad);color:#2A060C;box-shadow:0 4px 0 #8E2633}
.btn.small{width:auto;padding:10px 14px;font-size:14px}

.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.steps i{height:10px;background:var(--surface-2);border:1px solid var(--line)}
.steps i.f{background:var(--sun);border-color:var(--sun)} .steps i.t{background:var(--lilac);border-color:var(--lilac)} .steps i.s{background:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);font-weight:600;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:9px;height:9px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{background:var(--lcd);color:var(--lcd-ink);border-radius:6px;padding:10px 6px;display:grid;justify-items:center;gap:6px;text-align:center;box-shadow:inset 0 0 0 2px var(--lcd-2)}
.pk small{font-size:12px;color:var(--lcd-ink-2);font-weight:700}
.pk svg{width:30px;height:30px}
.pk .mv{font-family:var(--f-num);font-size:10px}
.pk .st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--lcd-2)}
.st.hit{background:var(--lcd-ink);color:var(--lcd)}
.cd{font-family:var(--f-num);font-size:10px}
.league{display:grid}
.lrow{display:grid;grid-template-columns:28px 30px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-radius:6px}
.lrow.me{background:var(--accent-soft);outline:1px solid var(--accent)}
.lrow .no{font-family:var(--f-num);font-size:10px;color:var(--ink-3);text-align:center}
.lrow.up .no{color:var(--ok)} .lrow.down .no{color:var(--bad)}
.av{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.lrow b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lrow small{font-size:11.5px;color:var(--ink-3)}
.lrow .sc{font-family:var(--f-num);font-size:10px}
.zone{font-family:var(--f-pix);font-size:8px;padding:8px 4px 4px;color:var(--ink-3)}
.zone.up{color:var(--ok)} .zone.down{color:var(--bad)}
.tier{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.tier i{width:12px;height:12px;transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:6px}
.stat small{font-size:12px;color:var(--ink-2);font-weight:600}
.stat b{font-family:var(--f-num);font-size:14px;font-weight:400}
.cmp{display:grid;gap:10px}
.cmp div{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.cmp i{display:block;height:12px;border:1.5px solid var(--ink-2);border-radius:99px;padding:1.5px}
.cmp u{display:block;height:100%;border-radius:99px}
.cmp span:last-child{font-family:var(--f-num);font-size:10px;text-align:right}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.notice b{color:var(--ink)}
.dev{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:12px;color:var(--ink-3)}
.dev button{border:1px dashed var(--line);background:none;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-2)}
.foot{font-size:12px;color:var(--ink-3);text-align:center;margin:0}

/* session */
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.sess[hidden]{display:none!important}
.shead{max-width:520px;width:100%;margin:0 auto;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding-block:14px 8px}
.x{width:36px;height:36px;border:0;background:none;display:grid;place-items:center;color:var(--ink-3)}
.x svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:square}
.sbar{height:14px;border:1.5px solid #E9E3F2;border-radius:99px;padding:2px}

.spts{display:inline-flex;gap:6px;align-items:center;color:var(--gold);font-family:var(--f-num);font-size:11px}
.sbody{max-width:520px;width:100%;margin:0 auto;overflow-y:auto;padding-block:8px 20px;display:grid;align-content:start;gap:16px}
.kick{font-family:var(--f-pix);font-size:9px;line-height:1.8;letter-spacing:.04em}
.kick.f{color:var(--sun)} .kick.t{color:var(--lilac)} .kick.s{color:var(--bad)}
.kick span{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:0;margin-left:6px;color:var(--ink-2)}
.q{margin:0;font-size:22px;line-height:1.4;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.newsbox{background:var(--lcd);color:var(--lcd-ink);border-radius:6px;padding:14px 16px;display:grid;gap:4px;box-shadow:inset 0 0 0 3px var(--lcd-2)}
.newsbox small{font-family:var(--f-pix);font-size:8px;color:var(--lcd-ink-2)}
.newsbox b{font-size:16.5px;line-height:1.45}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wxb{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:18px 10px;display:grid;justify-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:0 4px 0 #0d0b11}
.wxb svg{width:60px;height:60px}
.wxb small{font-size:12.5px;color:var(--ink-2);font-weight:500}
.wxb.sel.u{border-color:var(--sun);background:var(--sun-soft)}
.wxb.sel.d{border-color:var(--rain);background:var(--rain-soft)}
.wxb:disabled{cursor:default}
.badge{display:flex;gap:10px;align-items:center;background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:10px 12px;font-size:13.5px;font-weight:600}
.badge.lock{background:var(--surface-2);color:var(--ink-3)}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:15px 16px;text-align:left;font-size:16px;font-weight:600;box-shadow:0 4px 0 #0d0b11}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.msg{background:var(--lcd);color:var(--lcd-ink);border-radius:8px;padding:14px;display:grid;gap:10px;box-shadow:inset 0 0 0 3px var(--lcd-2)}
.msg .from{display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:700}
.msg .from i{width:32px;height:32px;border-radius:6px;background:var(--lcd-ink);color:var(--lcd);display:grid;place-items:center;font-style:normal;font-size:13px}
.msg .bub{background:#E3EAD2;border-radius:2px 12px 12px 12px;padding:12px 14px;font-size:15.5px;line-height:1.6;word-break:break-all}
.sf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sfoot{max-width:520px;width:100%;margin:0 auto;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.fb{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:slide .22s ease-out;border-top:2px solid}
@keyframes slide{from{transform:translateY(30px);opacity:.3}}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.bad{background:var(--bad-soft);border-color:var(--bad)} .fb.neu{background:var(--sun-soft);border-color:var(--sun)}
.fb h4{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fb.ok h4{color:var(--ok)} .fb.bad h4{color:var(--bad)} .fb.neu h4{color:var(--gold)}
.fb p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.fb .gain{font-family:var(--f-num);color:var(--gold);font-size:13px}
.fb-in{max-width:520px;margin:0 auto;width:100%;display:grid;gap:10px}
.float{position:fixed;z-index:70;font-family:var(--f-num);color:var(--gold);font-size:14px;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 2px 0 #000}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}
.done{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:24px}
.done canvas{width:160px;height:160px;image-rendering:pixelated;border-radius:8px;box-shadow:inset 0 0 0 4px var(--lcd-2)}
.done h2{margin:0;font-size:24px;letter-spacing:-.02em}
.done .earn{font-family:var(--f-num);font-size:28px;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.tiles div{border:1.5px solid #E9E3F2;border-radius:8px;padding:10px;display:grid;gap:6px}
.tiles small{font-family:var(--f-pix);font-size:7px;color:var(--ink-2)}
.tiles b{font-family:var(--f-num);font-size:12px;font-weight:400}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none!important}
.modal-in{background:var(--surface);border:1.5px solid #E9E3F2;border-radius:10px;padding:22px 18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;display:grid;gap:14px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.modal h3{margin:0;font-family:var(--f-pix);font-size:12px;line-height:1.8;text-align:center;color:var(--lilac)}
.jump{display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--f-num)}
.jump .a{font-size:14px;color:var(--ink-3)}
.jump .b{font-size:26px;color:var(--ok)}
.jump svg{width:26px;height:26px;stroke:var(--ok);fill:none;stroke-width:3}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);display:grid;align-items:end}
.sheet[hidden]{display:none!important}
.sheet-in{background:var(--surface);border-top:1.5px solid #E9E3F2;border-radius:12px 12px 0 0;max-height:88vh;overflow-y:auto;width:100%;max-width:520px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:slide .22s ease-out}
.sheet h3{margin:0;font-size:20px}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow > *{min-width:0}
.field{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:12px 14px}
.code{font-family:var(--f-num);font-size:18px;letter-spacing:.12em}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item b{display:block;font-weight:600} .item small{color:var(--ink-2);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--lcd);color:var(--lcd-ink);padding:11px 18px;border-radius:6px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 0 var(--lcd-2)}
/* figma layout: bubble + coin row, centered pet, tiles, big CTA */
.topbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.bubble{position:relative;background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:12px 14px 13px;box-shadow:inset 0 0 0 3px var(--lcd-2);font-size:14px;line-height:1.55;font-weight:600;min-height:60px;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:26px;bottom:-9px;width:16px;height:10px;background:var(--lcd-2);clip-path:polygon(0 0,100% 0,0 100%)}

.bubble .k em{font-style:normal;font-family:var(--f-num);color:var(--lcd-ink)}
.bubble p{margin:0}
.bubble small{display:block;font-size:12.5px;font-weight:500;color:var(--lcd-ink-2);margin-top:3px}
.bubble.ok{box-shadow:inset 0 0 0 3px #4E9A68} .bubble.ok::after{background:#4E9A68}
.bubble.bad{box-shadow:inset 0 0 0 3px #B84E5C} .bubble.bad::after{background:#B84E5C}
.bubble.ok .k b{color:#2C6B43} .bubble.bad .k b{color:#9A2E3D}
.bubble .k b{font-weight:400}
.coin{width:64px;height:64px;border-radius:50%;border:0;background:var(--gold);color:#1a1405;display:grid;place-items:center;align-content:center;gap:4px;box-shadow:0 4px 0 #8A6A1C,inset 0 0 0 3px #FFD978;font-family:var(--f-num);font-size:10px;padding:0}
.coin i{font-style:normal;font-family:var(--f-pix);font-size:9px;opacity:.75}
.coin:active{transform:translateY(2px);box-shadow:0 2px 0 #8A6A1C,inset 0 0 0 3px #FFD978}
.stage{aspect-ratio:1/.92}
.fct{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fct .pk{padding:12px 6px 10px;gap:4px}
.fct .pk svg{width:40px;height:40px}
.fct .pk b{font-size:15px;line-height:1.3}
.when{text-align:center;font-size:14.5px;color:var(--ink-2);margin:2px 0 0;font-weight:600}
.when .cd{font-family:var(--f-body);font-size:inherit;color:var(--ink)}
.btn.xl{padding:18px;font-size:17px}
.sech{margin:10px 0 -2px;font-size:19px;font-weight:700;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline}
.sech small{font-size:13px;color:var(--ink-2);font-weight:600}
.sess .shead{grid-template-columns:36px 1fr}
.sess .q{text-align:center;font-size:21px}
.petbox{display:grid;justify-items:center}
.petbox canvas{width:220px;max-width:70%;height:auto;aspect-ratio:192/160;image-rendering:pixelated;border-radius:10px;border:4px solid var(--lcd-2);display:block}
.petbox.sm canvas{width:150px}
.wx.over{margin-top:-38px;position:relative;z-index:1;padding-inline:6px}

function blank(){ return {league:"",nick:"",days:[],redeemed:[],wx:null} }

  fc:null, lastFc:null, weather:null, trained:{}, stats:{tr:{h:0,k:0}, un:{h:0,k:0}, safe:{h:0,k:0}, fc:{h:0,k:0}}, week:{id:null, score:0}, tier:0, best:0, combo:0} }
const WX=()=>S.me&&S.me.wx;
const lvl=xp=>1+Math.floor((xp||0)/120);
function newsFor(day){ return NK[Math.floor(rng("news:"+day)()*NK.length)] }

function buildItems(day){
  const v=WX(), r=rng((S.uid||"g")+":items:"+day), today=newsFor(day), tomorrow=newsFor(addDays(day,1));
  const items=ASSETS.map(a=>({type:"fc", asset:a.k}));
  const tcat=NEWS[tomorrow].cat, cats=[tcat,tcat,NEWS[today].cat];
  const used=new Set();
  for(const c of cats){ const pool=shuffle(TQ.map((q,i)=>i).filter(i=>TQ[i].cat===c&&!used.has(i)),r); const pick=pool[0]!=null?pool[0]:shuffle(TQ.map((q,i)=>i).filter(i=>!used.has(i)),r)[0]; used.add(pick); items.push({type:"tr", q:pick, order:shuffle([0,1,2].slice(0,TQ[pick].o.length),r)}) }
  const sf=shuffle(SF.map((s,i)=>i),r).slice(0,2); for(const i of sf) items.push({type:"sf", s:i});
  return {items, news:today, tomorrow};
}

function earn(n, label){
  const v=WX(); const room=Math.max(0, P.dailyCap-v.earnedToday); const got=Math.min(n,room);
  if(got<=0) return 0; v.earnedToday+=got; v.pts.total+=got;
  const h=v.pts.hist; if(h[0]&&h[0].t===label&&h[0].d===v.day) h[0].p+=got; else h.unshift({d:v.day,t:label,p:got}); if(h.length>40) h.pop();
  return got;
}
function addScore(n){ const v=WX(); v.week.score+=n }

function rollDay(){
  const v=WX(), t=kstDate();
  if(v.week.id!==weekId(t)){
    if(v.week.id!=null){ const rk=myRank(); if(rk.rank<=5 && v.tier<TIERS.length-1) v.tier++; else if(rk.rank>rk.total-5 && v.tier>0) v.tier-- }
    v.week={id:weekId(t), score:0};
  }
  if(v.day===t) return false;
  if(v.fc && !v.fc.res) resolveFc(true);
  const b=buildItems(t);
  Object.assign(v,{day:t, items:b.items, idx:0, earnedToday:0, todayNews:b.news, tomorrowNews:b.tomorrow, answers:[]});
  v.fc={day:t, news:b.news, picks:{}, trainedAt:{}, at:resolveAtFor(t), res:null};
  S.me.days=S.me.days||[]; if(!S.me.days.includes(t)) S.me.days.push(t);
  save(); return true;
}
function streak(){ const ds=[...new Set(S.me.days||[])].sort(); if(!ds.length) return 0; const t=kstDate(), last=ds[ds.length-1]; if(last!==t&&last!==addDays(t,-1)) return 0; let n=1; for(let i=ds.length-1;i>0;i--){ if(addDays(ds[i-1],1)===ds[i]) n++; else break } return n }

/* 예보 채점: 실제 서비스에선 장 마감 시세로 채점. 프로토타입은 뉴스별 범위 안에서 시뮬레이션한다. */
function marketMoves(day, news){ const n=NEWS[news], r=rng("mkt:"+day); const b=(x)=>x[0]+(x[1]-x[0])*r(); return {kr:b(n.kr), fx:b(n.fx), coin:b(n.coin)} }
function resolveFc(silent){
  const v=WX(), f=v.fc; if(!f||f.res) return;
  const mv=marketMoves(f.day, f.news), before=myRank();
  let hits=0, made=0, gained=0;
  const out=ASSETS.map(a=>{ const p=f.picks[a.k], ok=p?((p==="u")===(mv[a.k]>=0)):null;
    if(p){ made++; const tr=!!f.trainedAt[a.k]; const st=tr?v.stats.tr:v.stats.un; st.k++; v.stats.fc.k++; if(ok){ hits++; st.h++; v.stats.fc.h++ } }
    return {k:a.k, name:a.name, pick:p||null, move:mv[a.k], ok} });
  if(hits){ gained=earnLate(hits*P.fcHit, "예보 적중 보너스"); v.xp+=hits*15; addScore(hits*30); v.combo=(v.combo||0)+hits }
  if(made && hits<made) v.combo=0;
  f.res={mv, out, hits, made, gained, before:before.rank};
  v.weather=mv.kr; v.lastFc=f; v.fc=f;
  save();
  const after=myRank(); f.res.after=after.rank;
  if(!silent) showResult(f);
  else v.pendingReveal=true;
}
function earnLate(n,label){ const v=WX(); v.pts.total+=n; v.pts.hist.unshift({d:v.day,t:label,p:n}); if(v.pts.hist.length>40) v.pts.hist.pop(); return n }

const BOTN=["우산없이출근","환율요정","금리박사","코스피고양이","동학개미군","비트맨","적금왕","예보왕지망생","달러수집가","수출입국","갓생저축러","레이더","돈구름","맑음주의","비올확률","기압골","무지개펀드","소나기","바람개비"];
function league(){
  const v=WX(), t=kstDate(), wk=weekId(t), dayIdx=Math.floor(Date.parse(t+"T00:00:00Z")/864e5)-(wk*7-3);
  const prog=Math.min(1,(Math.max(0,dayIdx)+Math.min(24,kstHour())/24)/7);
  const r=rng("league:"+wk+":"+v.tier+":"+(S.me.league||"open"));
  const rows=BOTN.map((n,i)=>({id:"bot"+i, name:n, bot:true, score:Math.round((60+r()*(260+v.tier*60))*prog)}));
  const real=S.players.filter(p=>p.id!==S.uid&&p.wx&&p.wx.v===4&&p.wx.week&&p.wx.week.id===wk&&(!S.me.league||p.league===S.me.league));
  for(const p of real){ const pr=S.profiles[p.id]||{}; rows.push({id:p.id, name:pr.name||p.nick||"익명 예보관", score:p.wx.week.score, real:true, img:pr.avatarUrl}) }
  rows.push({id:"me", name:"나", me:true, score:v.week.score});
  rows.sort((a,b)=>b.score-a.score || (a.me?-1:b.me?1:0));
  while(rows.length>30){ const i=rows.findIndex((x,k)=>x.bot&&k>4&&!x.me); if(i<0) break; rows.splice(i,1) }
  return rows;
}
function myRank(){ const rows=league(); return {rank:rows.findIndex(x=>x.me)+1, total:rows.length, rows} }

function grid(){ return new Uint8Array(GW*GH) }
function px(g,x,y,v=1){ x=Math.round(x); y=Math.round(y); if(x>=0&&x<GW&&y>=0&&y<GH) g[y*GW+x]=v }
function text(g,str,x,y){ for(const ch of String(str).toUpperCase()){ const f=FONT[ch]||FONT[" "]; for(let i=0;i<15;i++) if(f[i]==="1") px(g,x+i%3,y+Math.floor(i/3)); x+=4 } }
function ring(g,cx,cy,rx,ry){ for(let a=0;a<360;a+=3){ const r=a*Math.PI/180; px(g,cx+Math.cos(r)*rx,cy+Math.sin(r)*ry) } }
function petState(){

  const done=v.idx>=v.items.length;
  return {stage, mood: done?"happy":(v.idx>0?"ok":"hungry"), wx: v.weather==null?"cloud":v.weather>.5?"sun":v.weather<-.5?"rain":"cloud", lv:lvl(v.xp)};
}
function drawPet(g,st,t,page){
  if(page===1){ // 상태 화면
    const v=WX(), r=x=>x&&x.k?x.h/x.k:0;
    const rows=[["FD",r(v.stats.fc)],["ST",r(v.stats.study)],["CL",r(v.stats.safe)]];
    rows.forEach(([lab,val],i)=>{ const y=2+i*7; text(g,lab,1,y); for(let x=0;x<21;x++){ px(g,10+x,y); px(g,10+x,y+4) } for(const yy of [1,2,3]){ px(g,10,y+yy); px(g,30,y+yy) } for(let x=0;x<Math.round(val*19);x++) for(let yy=1;yy<4;yy++) px(g,11+x,y+yy) });
    text(g,"LV"+st.lv,1,22); return;
  }
  // 날씨 아이콘
  if(st.wx==="sun"){ ring(g,5,5,2,2); for(const [dx,dy] of [[0,-4],[0,4],[-4,0],[4,0],[3,3],[-3,-3],[3,-3],[-3,3]]) px(g,5+dx,5+dy) }
  else { for(let x=2;x<10;x++) px(g,x,6); ring(g,4,5,2,1.5); ring(g,7,4,2.5,2); if(st.wx==="rain"){ const o=Math.floor(t*6)%3; for(const x of [3,6,9]) px(g,x,8+o) } }
  // 하단 상태 줄
  for(let x=0;x<GW;x+=2) px(g,x,20);
  text(g,"LV"+st.lv,1,22);
  const v=WX(), left=v?v.items.length-v.idx:0;
  text(g,left?("!"+left):"OK",GW-(left?9:8),22);
  // 펫 위치
  const walk=Math.sin(t*.6), cx=17+Math.round(walk*5), bounce=(st.mood==="happy"?Math.abs(Math.sin(t*5))*2:Math.abs(Math.sin(t*2))*1), cy=12-Math.round(bounce);
  const blink=(t%4)<.15;
  if(st.stage===0){ // 알
    const w=Math.round(Math.sin(t*3)*1); ring(g,17+w,11,5,7);
    for(const [x,y] of [[-2,-3],[2,0],[-1,3],[2,-4]]) px(g,17+w+x,11+y);
    if(st.mood==="happy"){ px(g,15+w,5);px(g,16+w,6);px(g,17+w,5);px(g,18+w,6) }
    return;
  }
  const R=[0,4,5,5,6,6][st.stage];
  // 우산 (비)
  if(st.wx==="rain"){ for(let a=180;a<=360;a+=6){ const r=a*Math.PI/180; px(g,cx+Math.cos(r)*(R+3),cy-R-3+Math.sin(r)*4) } for(let y=cy-R-3;y<cy-R+1;y++) px(g,cx+R+1,y) }
  ring(g,cx,cy,R,R*.9);
  // 발
  const step=Math.floor(t*4)%2; px(g,cx-3,cy+R*.9+1); px(g,cx-3-step,cy+R*.9+1); px(g,cx+3,cy+R*.9+1); px(g,cx+3+(1-step),cy+R*.9+1);
  // 눈
  const ey=cy-1, ex=Math.max(2,Math.round(R*.4));
  if(blink){ px(g,cx-ex,ey);px(g,cx-ex-1,ey);px(g,cx+ex,ey);px(g,cx+ex+1,ey) }
  else if(st.mood==="happy"){ px(g,cx-ex-1,ey);px(g,cx-ex,ey-1);px(g,cx-ex+1,ey); px(g,cx+ex-1,ey);px(g,cx+ex,ey-1);px(g,cx+ex+1,ey) }
  else { for(const s of [-1,1]){ px(g,cx+s*ex,ey);px(g,cx+s*ex,ey-1);px(g,cx+s*ex+(s>0?1:-1),ey);px(g,cx+s*ex+(s>0?1:-1),ey-1) } }
  // 입
  const my=cy+Math.round(R*.4);
  if(st.mood==="hungry"){ px(g,cx-1,my+1);px(g,cx,my);px(g,cx+1,my+1) }
  else { px(g,cx-2,my);px(g,cx-1,my+1);px(g,cx,my+1);px(g,cx+1,my+1);px(g,cx+2,my) }
  // 성장 장식
  if(st.stage>=2){ for(let y=1;y<4;y++) px(g,cx,cy-R*.9-y); px(g,cx-1,cy-R*.9-4);px(g,cx+1,cy-R*.9-4);px(g,cx,cy-R*.9-5) }
  if(st.stage>=3){ px(g,cx-R,cy-R*.6);px(g,cx-R-1,cy-R*.8);px(g,cx+R,cy-R*.6);px(g,cx+R+1,cy-R*.8) }
  if(st.stage>=4){ for(const s of [-1,1]){ const bx=cx+s*ex; for(let i=-2;i<=2;i++){ px(g,bx+i,ey-2);px(g,bx+i,ey+2) } px(g,bx-2,ey-1);px(g,bx-2,ey+1);px(g,bx+2,ey-1);px(g,bx+2,ey+1) } px(g,cx,ey-1);px(g,cx-1,ey-1);px(g,cx+1,ey-1) }
  if(st.stage>=5){ const ty=Math.round(cy-R*.9)-7; for(let i=-4;i<=4;i++) px(g,cx+i,ty+3); for(const i of [-4,0,4]){ px(g,cx+i,ty);px(g,cx+i,ty+1);px(g,cx+i,ty+2) } px(g,cx-2,ty+2);px(g,cx+2,ty+2) }
  // 말풍선
  if(st.mood==="hungry"){ const bx=cx+R+3, by=cy-R-2; ring(g,bx+3,by,4,3); text(g,"!",bx+2,by-2) }
  if(st.mood==="happy"){ const k=(t*2)%3, hx=cx+R+2, hy=cy-R-2-Math.round(k*2); px(g,hx,hy);px(g,hx+2,hy);px(g,hx-1,hy+1);px(g,hx+1,hy+1);px(g,hx+3,hy+1);px(g,hx,hy+2);px(g,hx+2,hy+2);px(g,hx+1,hy+3);px(g,hx+1,hy+1) }
}
function paintLCD(ctx,g,cw,ch){

}
function renderDone(){
  const v=WX(), s=S.sess, rk=myRank();
  if(W.ok) W.cheer=1.2;
  $("#sess").innerHTML=head().replace(/width:[\d.]+%/,"width:100%")+`<div class="sbody">${topRow("ok",`<span>ALL CLEAR</span><em>+${s?s.gained:0}P</em>`,`돈감이가 배불러!<small>18시에 적중한 만큼 +${P.fcHit}P씩 더 들어오고 순위가 올라가.</small>`)}
    <h1 class="q">오늘 돌보기 완료</h1>${pet("happy")}
    <div class="tiles"><div><small>STUDY+CLEAN</small><b>${s?s.right:0}/${s?s.total:0}</b></div><div><small>STREAK</small><b>${streak()}일</b></div><div><small>LEAGUE</small><b>${rk.rank}위</b></div></div></div>
    <div class="sfoot"><button class="btn" data-act="sclose">홈으로</button></div>`;
  petCanvas("sessPet","happy");
}

/* ================= 결과 발표 ================= */
function showResult(f){
  const r=f.res, el=$("#modal"), up=r.before-r.after;
  el.innerHTML=`<div class="modal-in"><h3>18:00 RESULT<br>예보 결과 발표</h3><div class="newsbox"><small>오늘의 뉴스</small><b>${esc(NEWS[f.news].head)}</b></div>
    <div class="picks">${r.out.map(o=>`<div class="pk"><small>${o.name}</small>${o.move>=0?SUN:RAIN}<span class="mv" style="color:${o.move>=0?"var(--bad)":"var(--rain)"}">${pct(o.move)}</span><span class="st ${o.pick?(o.ok?"hit":"miss"):"wait"}">${o.pick?(o.ok?"적중":"빗나감"):"안 함"}</span></div>`).join("")}</div>
    ${r.gained?`<div style="text-align:center;font-family:var(--f-num);font-size:30px;font-weight:700;color:var(--gold)">+${r.gained}P</div>`:""}
    ${up>0?`<div class="jump"><span class="a">${r.before}위</span><svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></svg><span class="b">${r.after}위</span></div><p class="foot">이번 주 리그에서 ${up}계단 올랐어</p>`:""}
    <div class="newsbox"><small>왜 이렇게 움직였을까</small><b style="font-size:14.5px;font-weight:500;line-height:1.6">${esc(NEWS[f.news].why)}</b></div>
    <button class="btn" data-act="mclose">확인</button></div>`;
  el.hidden=false; if(W.ok&&r.hits) W.cheer=2;
  WX().pendingReveal=false; save();
}

/* ================= 보조 시트 ================= */
function openSheet(h){ const el=$("#sheet"); el.innerHTML=`<div class="sheet-in">${h}<button class="btn ghost" data-act="shclose">닫기</button></div>`; el.hidden=false }
function sheetLeague(){
  const rk=myRank(), v=WX(), tier=TIERS[v.tier], ok=canSync(), lg=S.me.league;
  let h=`<h3><span class="tier"><i style="background:${tier[1]}"></i>${tier[0]} 리그 · 이번 주</span></h3><p class="foot" style="text-align:left">상위 5명은 다음 주 승급, 하위 5명은 강등. 점수 = 예보 참여 5 · 적중 30 · 훈련·특보 정답 10.</p><div class="league">`;
  rk.rows.forEach((r,i)=>{ if(i===5) h+=`<div class="zone up">▲ 승급권</div>`; if(i===rk.total-5) h+=`<div class="zone down">▼ 강등권</div>`; h+=lrow(r,i,rk.total) });
  h+=`</div><h3 style="font-size:16px">친구 리그</h3>`;
  if(lg) h+=`<div class="code">${esc(lg)}</div><div class="inrow"><button class="btn small" data-act="share">초대 문구 복사</button><button class="btn ghost small" data-act="leave">나가기</button></div><textarea class="field" id="sharetext" rows="3" hidden readonly aria-label="초대 문구"></textarea>`;
  else h+=`<div class="inrow"><input class="field num" id="lgcode" maxlength="8" placeholder="리그 코드" aria-label="리그 코드" ${ok?"":"disabled"}><button class="btn ghost small" data-act="join" ${ok?"":"disabled"}>참여</button><button class="btn small" data-act="create" ${ok?"":"disabled"}>만들기</button></div>`;
  h+=`<div class="inrow"><input class="field" id="nick" maxlength="12" value="${esc(S.me.nick||"")}" placeholder="리그에 보일 닉네임" aria-label="닉네임" ${ok?"":"disabled"}><button class="btn ghost small" data-act="nick" ${ok?"":"disabled"}>저장</button></div>`;
  if(!ok) h+=`<p class="foot">로그인한 상태에서 친구 리그를 만들 수 있어요.</p>`;
  openSheet(h); resolveNames();
}
function sheetPoints(){
  const v=WX(), bal=v.pts.total-v.pts.spent;
  const partners=[["제휴 은행 포인트",1000,"1,000P부터 1:1 전환"],["편의점 모바일 상품권",3000,"3,000원권"],["청년 적금 우대금리 쿠폰",5000,"+0.1%p"]];
  openSheet(`<h3>내 포인트</h3><div class="big">${fmt(bal)}P <span class="muted" style="font-size:15px">= ${fmt(bal)}원</span></div>
    <p class="foot" style="text-align:left">예보 참여 +${P.fcSubmit} · 적중 +${P.fcHit} · 훈련 +${P.trTry}(정답 +${P.trRight} 추가) · 특보 정답 +${P.sfRight} · 하루 최대 ${P.dailyCap}P</p>
    ${partners.map(p=>`<div class="item"><span><b>${p[0]}</b><small>${p[2]} · ${fmt(p[1])}P</small></span><button class="btn small" data-act="redeem" data-c="${p[1]}" data-n="${esc(p[0])}" ${bal>=p[1]?"":"disabled"}>${bal>=p[1]?"출금":"부족"}</button></div>`).join("")}
    <p class="foot">제휴 연동 전 프로토타입이라 출금은 신청만 기록돼요.</p>
    ${v.pts.hist.slice(0,10).map(x=>`<div class="item"><span><b>${esc(x.t)}</b><small>${esc(x.d)}</small></span><span class="num" style="color:var(--gold);font-weight:600">+${x.p}P</span></div>`).join("")}`);
}
function resolveNames(){ if(!S.user) return; const ids=S.players.map(p=>p.id).sort(), k=ids.join(","); if(k===S.profKey) return; S.profKey=k; S.user.profiles(ids).then(ps=>{ S.profiles=ps||{}; render() }) }

/* ================= 입력 ================= */
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("복사했어요") }catch(e){ const ta=$("#sharetext"); if(ta){ ta.hidden=false; ta.value=text; ta.select() } toast("아래 문구를 길게 눌러 복사해 주세요") } }
function genCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s }
function setOff(o){ S.off=o; LS.set("dg4.off",o) }
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]");
  if(!b){ if(e.target.id==="sheet") $("#sheet").hidden=true; return }
  const a=b.dataset.act, v=WX(); if(!v) return;
  if(a==="start"||a==="startOrToast") startSession();
  else if(a==="fc") answer("fc", b.dataset.v, b);
  else if(a==="tr") answer("tr", +b.dataset.o, b);
  else if(a==="sf") answer("sf", b.dataset.v, b);
  else if(a==="change") startChange();
  else if(a==="showres"){ if(v.fc&&v.fc.res) showResult(v.fc) }
  else if(a==="next"){ if(!S.sess.answered) return; if(S.sess.change) S.sess.change.i++; else v.idx++; S.sess.answered=!!S.sess.change; S.sess.sel=null; S.sess.gain=0; save(); renderItem() }
  else if(a==="sclose") closeSession();
  else if(a==="mclose"){ $("#modal").hidden=true; render() }
  else if(a==="league") sheetLeague();
  else if(a==="points") sheetPoints();
  else if(a==="streak") toast(`${streak()}일 연속 출석 중 · 매일 세션을 열면 이어져`);
  else if(a==="shclose") { $("#sheet").hidden=true; render() }
  else if(a==="resolveNow"){ const f=v.fc; if(!f) return; const need=Math.max(0, Math.ceil((f.at-Date.now())/36e5)-S.off.d*24); setOff({d:S.off.d,h:need}); resolveFc(false); render() }
  else if(a==="nextDay"){ setOff({d:S.off.d+1,h:0}); rollDay(); render(); if(v.pendingReveal&&v.lastFc&&v.lastFc.res) showResult(v.lastFc); toast("다음 날이 됐어요") }
  else if(a==="resetTime"){ setOff({d:0,h:0}); render() }
  else if(a==="create"){ S.me.league=genCode(); save(); sheetLeague() }
  else if(a==="join"){ const c=($("#lgcode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(c.length<4){ toast("리그 코드는 4자 이상이에요"); return } S.me.league=c; save(); sheetLeague() }
  else if(a==="leave"){ S.me.league=""; save(); sheetLeague() }
  else if(a==="nick"){ S.me.nick=($("#nick").value||"").trim().slice(0,12); save(); toast("닉네임을 저장했어요") }
  else if(a==="share") copy(`돈감에서 매일 3분 시장 예보 대결하자! 이번 주 ${myRank().rank}위야.\n리그 코드: ${S.me.league}\n${APP_URL}`);
  else if(a==="redeem"){ const c=+b.dataset.c; if(v.pts.total-v.pts.spent<c) return; v.pts.spent+=c; S.me.redeemed=(S.me.redeemed||[]).concat([{n:b.dataset.n,c,at:Date.now()}]); save(); sheetPoints(); toast("출금 신청을 기록했어요 (연동 전)") }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(!$("#modal").hidden){ $("#modal").hidden=true; render() } else if(!$("#sheet").hidden){ $("#sheet").hidden=true } else if(S.sess) closeSession() } });
setInterval(()=>{ const v=WX(); if(!v) return; if(kstDate()!==v.day){ rollDay(); render() } if(v.fc&&!v.fc.res&&nowMs()>=v.fc.at){ resolveFc(!!S.sess); if(!S.sess) render() } const cd=$("#cd"); if(cd&&v.fc) cd.textContent=cdText(v.fc.at-nowMs()) }, 20000);

/* ================= 시작 ================= */
function ensure(){ if(!S.me.wx||S.me.wx.v!==4) S.me.wx=newWx(); rollDay(); const v=WX(); if(v.fc&&!v.fc.res&&nowMs()>=v.fc.at) resolveFc(true) }
function afterLoad(){ ensure(); render(); const v=WX(); if(v.pendingReveal&&v.lastFc&&v.lastFc.res) showResult(v.lastFc) }
async function boot(){
  init3D();
  S.me=LS.get("dg4.local",null)||blank(); afterLoad();
  const c=window.claude; let db=null, user=null;
  if(c&&c.use){ try{ [db,user]=await Promise.all([c.use("db"),c.use("user")]) }catch(e){} }
  S.db=db; S.user=user; S.uid=user?await user.id():null; S.isOwner=user?await user.isOwner():false;
  if(!db||!S.uid){ S.noDb=!db; render(); return }
  try{ const snap=await db.doc("players/"+S.uid).get(); S.me=snap.exists?JSON.parse(JSON.stringify(snap.data())):blank() }catch(e){ S.me=blank() }
  S.me.days=S.me.days||[]; W.key=null; afterLoad();
  db.collection("players").limit(500).onSnapshot(snap=>{ S.players=snap.docs.map(d=>Object.assign({id:d.id},d.data())); resolveNames(); if(!S.sess) render() },()=>{});
}
boot();
})();
</script>

</body></html>
